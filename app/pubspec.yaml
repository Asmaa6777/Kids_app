name: family_call
description: "Family Call — a safe, invite-only calling and learning app for kids."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  audioplayers: ^6.8.1
  cloud_firestore: ^7.2.0
  cloud_functions: ^7.1.0
  crypto: ^3.0.8
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  firebase_storage: ^14.1.0
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  go_router: ^18.1.4
  http: ^1.6.0
  livekit_client: ^2.14.0
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  record: ^7.2.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0

flutter:
  uses-material-design: true

  # Baloo 2 (SIL Open Font License) is bundled so the child device never
  # contacts Google Fonts at runtime (privacy rule in CLAUDE.md).
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-600.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-700.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-800.ttf
          weight: 800
