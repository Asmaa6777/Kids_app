name: Flutter app

# Analyze, test and build an installable debug APK for every change to app/.
on:
  push:
    paths: ['app/**', '.github/workflows/flutter-app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/flutter-app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: family-call-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
