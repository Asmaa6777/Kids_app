name: Firebase backend

# Security rules + Cloud Functions, tested on the Firebase emulators (no real project needed).
on:
  push:
    paths: ['firebase/**', '.github/workflows/firebase.yml']
  pull_request:
    paths: ['firebase/**', '.github/workflows/firebase.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            firebase/functions/package-lock.json
            firebase/rules-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache emulator downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1
      - run: npm install -g firebase-tools@15
      - name: Security rules tests
        working-directory: firebase/rules-tests
        run: npm ci && npm run emulate
      - name: Cloud Functions tests (unit + emulator)
        working-directory: firebase/functions
        run: npm ci && npm test
