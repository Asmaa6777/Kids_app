<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fff5e4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- Design font. For the real app, self-host it so no request leaves to a third party. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<title>Family Call</title>
<style>
:root{
  --bg:#fff5e4; --ink:#2a2350; --sil:#554d6e; --cream:#fff4e3; --muted:#7d7596;
  --coral:#ff8a70; --coral-d:#e06a52;
  --yellow:#ffc947; --yellow-d:#d4a21f;
  --green:#5dd1a4; --green-d:#38a97c;
  --blue:#6eb6ff; --blue-d:#4592e0;
  --purple:#b79cff; --purple-d:#8f72e8;
  --pink:#ff9cc8; --pink-d:#e076a8;
  --red:#ff5a5f; --red-d:#cf3d43;
  --dot:#4a35e0; --night:#1f1a45; --night2:#332c66;
  --shade:rgba(42,35,80,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font-family:"Baloo 2",ui-rounded,"Segoe UI",system-ui,sans-serif;font-weight:700}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,select{user-select:text;-webkit-user-select:text;font:inherit;color:inherit}
#app{height:100dvh;max-width:560px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
.screen{height:100%;display:flex;flex-direction:column;padding:20px;gap:18px;overflow-y:auto;overflow-x:hidden;position:relative;isolation:isolate}
.blob{position:absolute;border-radius:50%;z-index:-1;pointer-events:none}
.hidden{display:none!important}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}
svg.ic{width:var(--is,32px);height:var(--is,32px);fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}

/* ---------- colour + 3D button system (from the design) ---------- */
.c-coral{--c:var(--coral);--d:var(--coral-d)}
.c-yellow{--c:var(--yellow);--d:var(--yellow-d)}
.c-green{--c:var(--green);--d:var(--green-d)}
.c-blue{--c:var(--blue);--d:var(--blue-d)}
.c-purple{--c:var(--purple);--d:var(--purple-d)}
.c-pink{--c:var(--pink);--d:var(--pink-d)}
.c-red{--c:var(--red);--d:var(--red-d)}
.c-white{--c:#fff;--d:var(--shade)}
.b3d{background:var(--c);box-shadow:0 8px 0 var(--d);transition:transform .08s,box-shadow .08s}
.b3d:not(:disabled):active{transform:translateY(6px);box-shadow:0 2px 0 var(--d)}
.cbtn{width:72px;height:72px;min-width:72px;border-radius:50%;display:grid;place-items:center;--is:34px}
.cbtn.lg{width:88px;height:88px;min-width:88px;--is:40px}
.cbtn.xl{width:112px;height:112px;min-width:112px;--is:52px}
.cbtn.on{background:var(--yellow)}
.pill{display:flex;align-items:center;gap:22px;width:100%;min-height:104px;border-radius:52px;padding:0 18px;
  font-size:clamp(26px,8vw,36px);font-weight:800;text-align:left;line-height:1}
.pill .ib{position:relative;width:80px;height:80px;min-width:80px;border-radius:50%;background:#fff;display:grid;place-items:center;--is:42px}
.pill .ib .udot{top:-4px;right:-4px;width:28px}
.pill.center{justify-content:center}
.pill.sm{min-height:80px;font-size:24px;gap:16px;padding:0 12px}
.pill.sm .ib{width:58px;height:58px;min-width:58px;--is:30px}

/* ---------- avatars (silhouette in a cream circle) ---------- */
.aw{position:relative;display:inline-block;width:var(--as,64px);flex:none;transition:transform .2s}
.ava{display:block;width:100%;aspect-ratio:1;border-radius:50%;background:var(--cream);border:var(--ab,4px) solid #fff;overflow:hidden}
.ava svg{display:block;width:100%;height:100%}
.ava video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.udot{position:absolute;top:1%;right:1%;width:24%;aspect-ratio:1;border-radius:50%;background:var(--dot);border:4px solid #fff;animation:pop .4s}
.aw.sm{--as:56px;--ab:4px}
.aw.md{--as:72px;--ab:5px}
.aw.lg{--as:150px;--ab:8px}
.aw.xl{--as:min(58vw,240px);--ab:10px}
.aw.active{transform:scale(1.12)}
.aw.active .ava{box-shadow:0 0 0 5px var(--yellow)}

/* ---------- login / onboarding ---------- */
.login{justify-content:center;gap:18px;padding:28px 22px}
.logo svg{width:104px;height:104px;display:block;margin:0 auto}
.login h1{text-align:center;font-size:42px;font-weight:800;line-height:1}
.login h2{font-size:32px;font-weight:800;line-height:1.1}
.sub{text-align:center;color:var(--muted);font-size:18px;font-weight:600}
.sub.left{text-align:left}
.card-btn{display:flex;align-items:center;gap:16px;text-align:left;border-radius:36px;padding:18px;min-height:104px}
.card-btn .ib{width:72px;height:72px;min-width:72px;border-radius:50%;background:var(--c);display:grid;place-items:center;--is:36px}
.card-btn b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.card-btn small{display:block;color:var(--muted);font-size:15px;font-weight:600;margin-top:4px;line-height:1.3}
.fine{text-align:center;color:var(--muted);font-size:14px;font-weight:600}
.step{color:var(--coral-d);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.field{width:100%;min-height:64px;border-radius:24px;border:3px solid #eedfc6;background:#fff;padding:0 20px;font-size:22px;font-weight:700;outline:none}
.field:focus{border-color:var(--coral)}
.field.code{text-align:center;letter-spacing:.3em;font-weight:800;text-transform:uppercase}
.field.sm{min-height:48px;font-size:17px;border-radius:16px;padding:0 14px}
.checklist{display:flex;flex-direction:column;gap:12px}
.checklist div{display:flex;gap:14px;align-items:center;background:#fff;border-radius:24px;padding:12px 14px;box-shadow:0 6px 0 var(--shade)}
.checklist .ib{width:52px;height:52px;min-width:52px;border-radius:50%;background:var(--c);display:grid;place-items:center;--is:26px}
.checklist b{display:block;font-size:18px;line-height:1.1}
.checklist small{display:block;color:var(--muted);font-size:14px;font-weight:600;line-height:1.3}
.topbar{display:flex;align-items:center;gap:14px}
.swatches{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.swatches button{width:52px;height:52px;border-radius:50%;background:var(--c);border:5px solid #fff;box-shadow:0 4px 0 var(--d)}
.swatches button.on{outline:4px solid var(--ink)}

/* ---------- PIN pad ---------- */
.dots{display:flex;gap:16px;justify-content:center;margin:6px 0 14px}
.dots i{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);opacity:.35}
.dots i.on{background:var(--ink);opacity:1}
.shake{animation:shake .4s}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:14px;justify-content:center}
.key{width:78px;height:78px;border-radius:50%;font-size:30px;font-weight:800;display:grid;place-items:center;--is:30px}
.lockbig{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;--is:48px;margin:0 auto}
.center{align-items:center;justify-content:center;text-align:center}

/* ---------- child home ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-bottom:12px}
.tile{border-radius:40px;padding:22px 10px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;
  font-size:clamp(20px,6.2vw,28px);font-weight:800;line-height:1.05}
.tile .aw{--as:76%;--ab:6px}
.tile:disabled{opacity:.4}
.gate-corner{position:absolute;top:0;left:0;width:84px;height:84px;z-index:5;display:grid;place-items:center}
.gate-corner svg{opacity:0;transition:opacity .3s}
.gate-corner.show svg{opacity:.6}
.sleep{position:absolute;left:16px;right:16px;bottom:24px;background:var(--night);color:#fff;border-radius:36px;padding:20px;
  display:flex;flex-direction:column;align-items:center;gap:4px;--is:56px;z-index:6}
.sleep b{font-size:26px}

/* ---------- person ---------- */
.person{justify-content:space-between;align-items:center;padding-bottom:30px}
.person>.cbtn{align-self:flex-start}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px}
.hero h2{font-size:clamp(42px,12vw,58px);font-weight:800;line-height:1}
.stack{display:flex;flex-direction:column;gap:20px;width:100%}

/* ---------- chat ---------- */
.chat{background:#dfeefc;padding:0;gap:0}
.chat-h{display:flex;align-items:center;gap:14px;padding:18px 20px 8px;font-size:clamp(30px,9vw,40px);font-weight:800}
.msgs{flex:1;overflow-y:auto;padding:12px 20px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;align-items:center;gap:10px;max-width:94%}
.msg.me{align-self:flex-end}
.bub{background:#fff;border-radius:44px;padding:10px}
.msg.me .bub{background:var(--blue)}
.voice{display:flex;align-items:center;gap:14px;padding-right:16px}
.voice .pp{width:64px;height:64px;min-width:64px;border-radius:50%;display:grid;place-items:center;background:var(--pc,var(--coral));color:var(--ink);--is:26px}
.voice .pp svg{fill:currentColor}
.msg.me .voice .pp{background:#fff}
.wave{display:flex;gap:4px;align-items:center;height:44px}
.wave i{width:4px;border-radius:2px;background:var(--ink)}
.voice.playing .wave i{animation:bounce .5s ease-in-out infinite alternate}
.voice small{font-size:18px;font-weight:800;min-width:38px}
.bub.pic{padding:10px;border-radius:36px}
.bub.pic img{display:block;width:min(62vw,260px);border-radius:28px}
.sticker svg{width:116px;height:116px;display:block}
.bub.text{padding:14px 22px;font-size:22px;user-select:text;-webkit-user-select:text}
.empty{margin:auto;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px;--is:48px}
.composer{padding:8px 20px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.tools{display:flex;justify-content:center;gap:22px}
.talk{justify-content:center;min-height:96px;touch-action:none;gap:16px}
.talk>.ic{--is:48px}
.talk.hot{transform:scale(1.03);box-shadow:0 2px 0 var(--d),0 0 0 12px rgba(255,138,112,.3)}
.talk .live{display:flex;align-items:center;gap:14px}
.live .bars{display:flex;gap:4px;align-items:center;height:48px}
.live .bars i{width:6px;height:100%;background:var(--ink);border-radius:3px;transform:scaleY(.15);transition:transform .06s}
.tray{background:#fff;border-radius:36px;box-shadow:0 8px 0 rgba(69,146,224,.25);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px}
.tray button{aspect-ratio:1;border-radius:22px;display:grid;place-items:center}
.tray button:active{background:#dfeefc;transform:scale(.92)}
.tray svg{width:84%;height:84%}
.textrow{display:flex;gap:10px}

/* ---------- full-screen sheets (draw / camera) ---------- */
.modal{position:absolute;inset:0;background:var(--mbg,#ffe0ec);z-index:20;display:flex;flex-direction:column;gap:16px;padding:20px}
.sheet{flex:1;min-height:200px;background:#fff;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 8px 0 var(--shade)}
.sheet canvas,.sheet video,.sheet img{width:100%;height:100%;display:block;object-fit:cover;touch-action:none}
.row{display:flex;align-items:center;justify-content:center;gap:12px}
.row.start{justify-content:flex-start}
.sw{width:clamp(46px,13.5vw,64px);aspect-ratio:1;border-radius:50%;border:6px solid #fff;background:var(--c);flex:none}
.sw.on{box-shadow:0 0 0 5px var(--ink)}
.pen-dot{width:30px;height:30px;border-radius:50%;background:var(--ink)}
.starbtn{flex:1;max-width:220px;height:72px;border-radius:40px;display:grid;place-items:center;--is:38px}
.pcur{position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;border:6px solid;transform:translate(-50%,-50%);left:-40px;top:-40px;pointer-events:none}

/* ---------- call ---------- */
.call{background:var(--night);padding:16px;gap:16px}
.stage{flex:1;border-radius:40px;overflow:hidden;position:relative;min-height:280px}
.namepill{position:absolute;top:18px;left:18px;background:#fff;border-radius:30px;padding:6px 24px;font-size:26px;font-weight:800;z-index:2;line-height:1.15}
.namepill small{display:block;font-size:14px;color:var(--muted);font-weight:700}
.remote{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center}
.remote svg{width:92%;max-width:440px;display:block}
.selfview{position:absolute;top:18px;right:18px;width:30%;aspect-ratio:3/4;border-radius:28px;border:6px solid #fff;background:#dfeefc;overflow:hidden;z-index:2}
.selfview video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.selfview video.mirror{transform:scaleX(-1)}
.selfview .ph svg{position:absolute;left:0;bottom:-6%;width:100%}
.fx{position:absolute;left:20%;width:60%;pointer-events:none;z-index:3}
.fx.top{top:12%}.fx.mid{top:33%}
.fx svg{width:100%;display:block}
.letsplay{position:absolute;left:18px;bottom:22px;z-index:2;width:auto;min-height:80px;font-size:26px;padding:0 28px 0 10px;gap:14px}
.letsplay .ib{width:60px;height:60px;min-width:60px;--is:32px}
.ctl-panel{background:var(--night2);border-radius:36px;padding:14px 16px 22px;display:flex;flex-direction:column;gap:16px}
.frow{display:flex;gap:12px;overflow-x:auto;padding:9px}
.ftile{width:78px;min-width:78px;height:78px;border-radius:24px;display:grid;place-items:center;background:var(--c);--is:40px}
.ftile.on{box-shadow:0 0 0 4px var(--night2),0 0 0 9px var(--yellow)}
.crow{display:flex;justify-content:space-around;align-items:center}
.pulse{animation:pulse 2s infinite}

/* ---------- incoming call + game invite ---------- */
.incoming,.invite{align-items:center;justify-content:space-between;padding:40px 20px 30px;text-align:center}
.incoming h2,.invite h2{font-size:clamp(44px,13vw,60px);font-weight:800;line-height:1}
.halo{border-radius:50%;margin-top:70px;animation:halo 2.4s ease-in-out infinite;
  box-shadow:0 0 0 40px rgba(255,255,255,.22),0 0 0 88px rgba(255,255,255,.12)}
.incoming .mid,.invite .mid{display:flex;flex-direction:column;align-items:center;gap:40px}
.invite .mid{gap:24px}
.inv-av{position:relative;display:inline-block}
.badge{position:absolute;right:-8%;bottom:4%;width:44%;aspect-ratio:1;border-radius:50%;background:var(--c);border:7px solid #fff;display:grid;place-items:center;--is:52%}
.irow{display:flex;gap:16px;width:100%;align-items:center}
.irow .pill{flex:1}
.pill>.ic{--is:46px}
.dots3{display:flex;gap:10px}
.dots3 i{width:16px;height:16px;border-radius:50%;background:var(--ink);animation:dot 1s infinite alternate}
.dots3 i:nth-child(2){animation-delay:.2s}.dots3 i:nth-child(3){animation-delay:.4s}

/* ---------- games ---------- */
.ghead{display:flex;align-items:center;gap:14px}
.ghead .sp{flex:1}
.gcard{min-height:clamp(112px,18dvh,160px);border-radius:52px;font-size:clamp(28px,9vw,40px);gap:26px}
.gcard .ib{width:clamp(84px,25vw,112px);height:clamp(84px,25vw,112px);min-width:clamp(84px,25vw,112px);--is:52%}
.gstage{flex:1;display:flex;flex-direction:column;gap:16px;min-height:0}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(100%,400px);margin:auto}
.cell{aspect-ratio:1;border-radius:28px;background:#fff;box-shadow:0 7px 0 rgba(143,114,232,.35);display:grid;place-items:center}
.cell svg{width:68%;height:68%}
.cell:not(:disabled):active{transform:translateY(5px);box-shadow:0 2px 0 rgba(143,114,232,.35)}
.over{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:auto}
.bigstar{color:var(--yellow-d);--is:84px}
.bigstar svg{fill:var(--yellow)}
.score{display:flex;justify-content:center;gap:28px}
.score>span{display:flex;align-items:center;gap:6px;--is:26px;color:var(--yellow-d)}
.score svg.ic{fill:var(--yellow)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(100%,420px);margin:auto}
.card{aspect-ratio:3/4;border-radius:22px;display:grid;place-items:center;color:#fff;--is:46%}
.card.open{background:#fff;box-shadow:0 6px 0 rgba(56,169,124,.35)}
.card.open svg{width:78%;height:78%}
.card.done{opacity:.55}
.pz-board{background:#fff;border-radius:40px;padding:14px;box-shadow:0 8px 0 rgba(69,146,224,.3);width:min(100%,420px);margin:auto auto 0}
.pz-grid{display:grid;grid-template-columns:repeat(3,1fr);border-radius:28px;overflow:hidden;aspect-ratio:1}
.pz-cell{background-size:300% 300%;position:relative}
.pz-slot{background:var(--cream);outline:4px dashed #b3aab8;outline-offset:-6px}
.pz-tray{background:#fff;border-radius:40px;padding:18px;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;
  box-shadow:0 8px 0 rgba(69,146,224,.3);min-height:150px;width:min(100%,420px);margin:0 auto auto}
.piece{width:min(22vw,104px);aspect-ratio:1;border-radius:24px;background-size:300% 300%;border:5px solid #dfeefc;touch-action:none}
.piece.sel{border-color:var(--blue-d);transform:scale(1.06)}
.piece.partner{border-color:var(--coral);transform:scale(1.06)}
.ghost{position:fixed;z-index:100;pointer-events:none;border-radius:24px;background-size:300% 300%;border:5px solid var(--blue-d);
  box-shadow:0 12px 24px rgba(0,0,0,.2);transform:translate(-50%,-50%) scale(1.08)}
.wiggle{animation:shake .4s}

/* ---------- adult screens (parent + family member) ---------- */
.adult{background:#f6f3fb;gap:14px}
.adult-h{display:flex;align-items:center;gap:12px}
.adult-h .sp{flex:1}
.adult-h small{display:block;color:var(--muted);font-weight:600}
.adult-h b{font-size:22px;font-weight:800}
.panel{background:#fff;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:19px;font-weight:800}
.panel p{color:var(--muted);font-size:15px;font-weight:600}
.panel.col{align-items:center;text-align:center}
.panel.col h2{font-size:28px;font-weight:800}
.prow{display:flex;align-items:center;gap:10px}
.prow .grow{flex:1;min-width:0;font-size:18px}
.mini-btn{width:44px;height:44px;border-radius:14px;background:#f1ecf8;display:grid;place-items:center;--is:22px}
.mini-btn:disabled{opacity:.3}
.btn{min-height:52px;border-radius:18px;padding:0 18px;font-size:17px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;--is:22px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.tog small{display:block;color:var(--muted);font-size:14px;font-weight:600}
.tog input{display:none}
.tog i{width:58px;height:34px;min-width:58px;border-radius:20px;background:#ddd;position:relative;transition:.2s}
.tog i::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.tog input:checked+i{background:var(--green)}
.tog input:checked+i::after{left:28px}
.times{display:flex;align-items:center;gap:8px;color:var(--muted)}
.times input{min-height:44px;border-radius:12px;border:2px solid #eadfce;padding:0 10px}
.act-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:220px;overflow:auto;font-size:15px;font-weight:600}
.act-list li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #f0ecf4;padding:7px 0}
.act-list time{color:var(--muted);white-space:nowrap}
.code-chip{font-family:ui-monospace,monospace;font-size:22px;font-weight:800;letter-spacing:.2em;background:#fff1cc;border-radius:12px;padding:6px 12px}
.demo{border:2px dashed #d9cdea}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.link{color:var(--muted);text-decoration:underline;font-size:15px;padding:12px;font-weight:600}
.muted{color:var(--muted);font-weight:600}

/* ---------- toast + confetti ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:20px;
  font-size:17px;z-index:200;max-width:90vw;text-align:center}
.conf{position:absolute;top:-20px;width:14px;height:14px;z-index:50;pointer-events:none;animation:fall 1.8s ease-in forwards}

function chime(){
  try{ const ac=new AudioContext(), o=ac.createOscillator(), g=ac.createGain();

  });
}

function setupGate(el){
  let start=0, raf=0; const ring = el.querySelector('circle');
  const end = () => { cancelAnimationFrame(raf); start=0; el.classList.remove('show'); ring.style.strokeDashoffset='176'; };
  const tick = () => {
    const p = Math.min(1, (performance.now()-start)/3000);
    if(p>.33){ el.classList.add('show'); ring.style.strokeDashoffset = String(176*(1-(p-.33)/.67)); }
    if(p>=1){ end(); go(gate); } else raf = requestAnimationFrame(tick);
  };
  el.onpointerdown = e => { e.preventDefault(); el.setPointerCapture(e.pointerId); start=performance.now(); raf=requestAnimationFrame(tick); };
  el.onpointerup = el.onpointercancel = end;
  onCleanup(end);
}

/* ---------- hold-to-record voice notes ---------- */
async function startRecording(){
  if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){ toast('Voice notes need HTTPS or localhost'); return null; }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); }
  catch(e){ toast('Please allow the microphone'); return null; }
  const mime = ['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(stream, mime?{mimeType:mime}:undefined), chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.start();
  const ac = new AudioContext(), an = ac.createAnalyser(); an.fftSize = 64;
  ac.createMediaStreamSource(stream).connect(an);
  const t0 = performance.now(); let done = null;
  const stop = () => done ||= new Promise(res=>{
    const dur = (performance.now()-t0)/1000;
    rec.onstop = () => {
      stream.getTracks().forEach(t=>t.stop()); ac.close();
      const fr = new FileReader(); fr.onload = ()=>res({url:fr.result, dur});
      fr.readAsDataURL(new Blob(chunks, {type:rec.mimeType||'audio/webm'}));
    };
    rec.state!=='inactive' ? rec.stop() : rec.onstop();
  });
  return {stop, an, t0};
}

function setupMic(id){
  const talk = $('#talk'), lbl = talk.querySelector('.lbl'), live = talk.querySelector('.live');
  const bars = [...live.querySelectorAll('.bars i')], rt = live.querySelector('b');
  let holding = false, r = null, raf = 0;
  const show = on => { talk.classList.toggle('hot', on); lbl.classList.toggle('hidden', on); live.classList.toggle('hidden', !on); };
  const meter = () => {
    const d = new Uint8Array(r.an.frequencyBinCount); r.an.getByteFrequencyData(d);
    bars.forEach((b,i)=>b.style.transform = `scaleY(${.12+Math.min(1, d[i+1]/200)})`);
    rt.textContent = mmss((performance.now()-r.t0)/1000);
    raf = requestAnimationFrame(meter);
  };
  const finish = async (discard=false) => {
    holding = false; show(false); cancelAnimationFrame(raf);
    if(!r) return; const cur = r; r = null;
    const res = await cur.stop();
    if(discard) return;
    if(res.dur < .7) return toast('Hold the button while you talk');
    send(id, {type:'voice', data:res.url, dur:Math.max(1, Math.round(res.dur))});
  };
  talk.onpointerdown = async e => {
    e.preventDefault(); talk.setPointerCapture(e.pointerId);
    holding = true; talk.classList.add('hot'); $('#tray').classList.add('hidden');
    const got = await startRecording();
    if(!got){ holding = false; talk.classList.remove('hot'); return; }
    r = got;
    if(!holding) return finish();             // released before the mic was ready
    show(true); meter();
    later(()=>{ if(r===got) finish(); }, 60000);   // 60 s cap
  };
  talk.onpointerup = talk.onpointercancel = () => { if(r) finish(); else { holding = false; talk.classList.remove('hot'); } };
  onCleanup(()=>finish(true));
}

/* ---------- shared drawing board (chat drawings + Draw game) — design page 8 ---------- */
function drawBoard(canvas){
  const ctx = canvas.getContext('2d'), rect = canvas.getBoundingClientRect(), dpr = devicePixelRatio||1, W = rect.width, H = rect.height;
  canvas.width = W*dpr; canvas.height = H*dpr; ctx.scale(dpr,dpr); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const strokes = [];
  const seg = (s,a,b) => { ctx.strokeStyle=s.color; ctx.lineWidth=s.w; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); };
  const paint = s => { if(s.pts.length===1) seg(s, s.pts[0], {x:s.pts[0].x+.1, y:s.pts[0].y}); for(let i=1;i<s.pts.length;i++) seg(s, s.pts[i-1], s.pts[i]); };
  const redraw = () => { ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); strokes.forEach(paint); };
  const b = { W, H, color:INK[1], erase:false,
    begin(p, color, w, who){ const s = {color, w, who, pts:[p]}; strokes.push(s); paint(s); return s; },
    extend(s, p){ const a = s.pts[s.pts.length-1]; s.pts.push(p); seg(s, a, p); },
    undo(){ for(let i=strokes.length-1;i>=0;i--) if(strokes[i].who==='me'){ strokes.splice(i,1); break; } redraw(); },
  };
  const pt = e => { const r = canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  let cur = null;
  canvas.onpointerdown = e => { canvas.setPointerCapture(e.pointerId); cur = b.begin(pt(e), b.erase?'#fff':b.color, b.erase?30:10, 'me'); };
  canvas.onpointermove = e => { if(cur) b.extend(cur, pt(e)); };
  canvas.onpointerup = canvas.onpointercancel = () => cur = null;
  redraw(); return b;
}
function drawUI(root, onStar){
  root.insertAdjacentHTML('beforeend', `<div class="sheet"><canvas></canvas></div>
    <div class="row">${INK.slice(1).map((c,i)=>`<button class="sw${i?'':' on'}" data-c="${c}" style="--c:${c}" aria-label="Colour"></button>`).join('')}</div>
    <div class="row">
      <button class="cbtn c-white b3d" data-t="pen" aria-label="Dark pen"><span class="pen-dot"></span></button>
      <button class="cbtn c-white b3d" data-t="eraser" aria-label="Eraser">${icon('eraser')}</button>
      <button class="cbtn c-white b3d" data-t="undo" aria-label="Undo">${icon('undo')}</button>
      <button class="starbtn c-yellow b3d" data-t="star" aria-label="Send picture">${icon('star')}</button>
    </div>`);
  const cv = root.querySelector('canvas'), b = drawBoard(cv);
  const sws = [...root.querySelectorAll('.sw')], pen = root.querySelector('[data-t=pen]'), er = root.querySelector('[data-t=eraser]');
  const sel = color => { b.erase=false; b.color=color; sws.forEach(s=>s.classList.toggle('on', s.dataset.c===color)); pen.classList.toggle('on', color===INK[0]); er.classList.remove('on'); };
  sws.forEach(s=>s.onclick=()=>sel(s.dataset.c));
  pen.onclick = ()=>sel(INK[0]);
  er.onclick = ()=>{ b.erase=true; er.classList.add('on'); pen.classList.remove('on'); sws.forEach(s=>s.classList.remove('on')); };
  root.querySelector('[data-t=undo]').onclick = ()=>b.undo();
  root.querySelector('[data-t=star]').onclick = ()=>onStar(cv);
  return b;
}

function drawModal(id){

function ringtone(){
  let ac; try{ ac = new AudioContext(); }catch(e){ return ()=>{}; }
  const beep = () => [0,.25].forEach((off,k)=>{
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+off;
    o.frequency.value = k?784:659; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.22);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+.25);
  });
  beep(); const iv = setInterval(beep, 1600);
  return () => { clearInterval(iv); ac.close(); };
}

/* ----- Shared jigsaw puzzle ----- */
function puzzle(el, c){
  const all = [...Array(9).keys()];
  const missing = shuffle(all).slice(0,4);
  const placed = new Set(all.filter(i=>!missing.includes(i)));
  let sel = null, dragging = false;
  const bg = i => `background-image:url('${SCENE_URL}');background-position:${(i%3)*50}% ${Math.floor(i/3)*50}%`;
  const left = () => missing.filter(i=>!placed.has(i));

  const render = () => {
    el.innerHTML = `<div class="pz-board"><div class="pz-grid">${all.map(i=>placed.has(i)
        ? `<div class="pz-cell" style="${bg(i)}"></div>`
        : `<div class="pz-cell pz-slot" data-slot="${i}"></div>`).join('')}</div></div>
      <div class="pz-tray">${left().length
        ? left().map(i=>`<button class="piece${sel===i?' sel':''}" data-p="${i}" style="${bg(i)}" aria-label="Puzzle piece"></button>`).join('')
        : `<span class="bigstar">${icon('star')}</span><button class="cbtn lg c-green b3d" id="again" aria-label="Play again">${icon('undo')}</button>`}</div>`;
    el.querySelectorAll('[data-slot]').forEach(s=>s.onclick=()=>{ if(sel!==null) tryPlace(sel, +s.dataset.slot, s); });
    el.querySelectorAll('.piece').forEach(bindPiece);
    el.querySelector('#again')?.addEventListener('click', ()=>puzzle(el, c));
  };
  const place = i => {
    placed.add(i); sel = null; chime(); render();
    if(placed.size===9){ confetti(); say('You did it!'); }
  };
  const tryPlace = (i, slot, slotEl) => {
    if(i===slot){ say('Yes!'); place(i); }
    else { slotEl.classList.remove('wiggle'); void slotEl.offsetWidth; slotEl.classList.add('wiggle'); say('Try another spot'); }
  };
  // drag a piece onto the board, or tap a piece then tap a spot
  function bindPiece(pe){
    const i = +pe.dataset.p;
    let start = null, ghost = null;
    pe.onpointerdown = e => { pe.setPointerCapture(e.pointerId); start = {x:e.clientX, y:e.clientY}; dragging = true; };
    pe.onpointermove = e => {
      if(!start) return;
      if(!ghost && Math.hypot(e.clientX-start.x, e.clientY-start.y) > 8){
        const r = pe.getBoundingClientRect();
        ghost = document.createElement('div'); ghost.className = 'ghost';
        ghost.style.cssText += `${bg(i)};width:${r.width}px;height:${r.height}px`;
        document.body.appendChild(ghost); pe.style.opacity = '.3';
      }
      if(ghost){ ghost.style.left = e.clientX+'px'; ghost.style.top = e.clientY+'px'; }
    };
    pe.onpointerup = pe.onpointercancel = e => {
      dragging = false;
      if(!start) return; start = null;
      if(ghost){
        ghost.remove(); ghost = null; pe.style.opacity = '';
        const slot = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-slot]');
        if(slot) tryPlace(i, +slot.dataset.slot, slot);
      } else { sel = sel===i ? null : i; render(); }
    };
  }
  onCleanup(()=>document.querySelectorAll('.ghost').forEach(g=>g.remove()));
  // Simulated partner helps with one piece now and then (never the last one)
  const partner = () => later(()=>{
    const l = left();
    if(!dragging && l.length>1){
      const i = pick(l); el.querySelector(`[data-p="${i}"]`)?.classList.add('partner');
      later(()=>{ if(!dragging && !placed.has(i)){ place(i); say(`${c.name} helped!`); } partner(); }, 900);
    } else if(placed.size<9) partner();
  }, 8000);
  render(); partner(); say('Put the pieces in the picture!');
}

/* ----- Match pairs (shapes + colours, spoken aloud) ----- */
const SHAPES = [
  {n:'red circle',     svg:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="#ff6b4a"/></svg>'},
  {n:'blue square',    svg:'<svg viewBox="0 0 100 100"><rect x="18" y="18" width="64" height="64" rx="12" fill="#3f8fe0"/></svg>'},
  {n:'yellow triangle',svg:'<svg viewBox="0 0 100 100"><path d="M50 16 86 80H14z" fill="#ffad1f" stroke="#ffad1f" stroke-width="8" stroke-linejoin="round"/></svg>'},
  {n:'pink heart',     svg:'<svg viewBox="0 0 100 100"><path d="M50 86C22 66 10 51 10 35 10 22 20 13 32 13c8 0 14 5 18 11 4-6 10-11 18-11 12 0 22 9 22 22 0 16-12 31-40 51z" fill="#ff5c8a"/></svg>'},
  {n:'purple star',    svg:`<svg viewBox="0 0 100 100"><path d="${starPath(50,53,40,18)}" fill="#8c6fe6" stroke="#8c6fe6" stroke-width="5" stroke-linejoin="round"/></svg>`},
  {n:'green diamond',  svg:'<svg viewBox="0 0 100 100"><path d="M50 12 86 50 50 88 14 50z" fill="#34a87a" stroke="#34a87a" stroke-width="6" stroke-linejoin="round"/></svg>'},
];
function match(el, c){
  const deck = shuffle([...SHAPES.keys()].flatMap(k=>[k,k]));
  let open = [], done = new Set(), turn = 'me', busy = false, score = {me:0, them:0};
  const stars = n => n ? Array.from({length:n},()=>icon('star')).join('') : '';
  const render = () => {
    setTurn(done.size===12 ? null : turn);
    el.innerHTML = `<div class="score"><span>${avatar(meRing(c),'sm')}${stars(score.me)}</span><span>${avatar(pal(c.color).c,'sm')}${stars(score.them)}</span></div>
      <div class="cards">${deck.map((k,i)=>{ const o = open.includes(i)||done.has(i);
        return `<button class="card c-purple ${o?'open':'b3d'} ${done.has(i)?'done':''}" data-i="${i}" ${o||busy||turn!=='me'?'disabled':''} aria-label="Card">${o?SHAPES[k].svg:icon('star')}</button>`; }).join('')}</div>
      ${done.size===12?`<div class="over"><span class="bigstar">${icon('star')}</span><button class="cbtn lg c-green b3d" id="again" aria-label="Play again">${icon('undo')}</button></div>`:''}`;
    el.querySelectorAll('.card').forEach(x=>x.onclick=()=>flip(+x.dataset.i));
    el.querySelector('#again')?.addEventListener('click', ()=>match(el, c));
  };
  const flip = i => {
    open.push(i); if(turn==='me') say(SHAPES[deck[i]].n); render();
    if(open.length<2) return;
    busy = true; render();
    later(()=>{
      const [x,y] = open;
      if(deck[x]===deck[y]){ done.add(x); done.add(y); score[turn]++; chime(); say(turn==='me'?'Yay! A match!':'Match!'); }
      else turn = turn==='me' ? 'them' : 'me';
      open = []; busy = false; render();
      if(done.size===12){ confetti(); say('All found! Great job!'); }
      else if(turn==='them') partnerTurn();
    }, 1100);
  };
  const partnerTurn = () => {
    const [a,b] = shuffle(deck.map((_,i)=>i).filter(i=>!done.has(i)));
    later(()=>{ open = [a]; render(); later(()=>flip(b), 700); }, 700);
  };
  render(); say('Find the matching shapes!');
}

/* ----- Tic-tac-toe ----- */
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const MARK = {
  me:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="28" fill="none" stroke="#3f8fe0" stroke-width="14"/></svg>',
  them:'<svg viewBox="0 0 100 100"><path d="M26 26 74 74M74 26 26 74" stroke="#ff6b4a" stroke-width="14" stroke-linecap="round"/></svg>',
};
function ttt(el, c){
  let b = Array(9).fill(null), turn = 'me', over = null;
  const win = w => LINES.some(l=>l.every(i=>b[i]===w));
  const aiMove = () => {
    for(const who of ['them','me']) for(const l of LINES){ const v = l.map(i=>b[i]);
      if(v.filter(x=>x===who).length===2 && v.includes(null) && Math.random()<.7) return l[v.indexOf(null)]; }
    return pick(b.map((v,i)=>v?null:i).filter(i=>i!==null));
  };
  const move = (i, w) => {
    b[i] = w;
    if(win(w)){ over = w; say(w==='me'?'You win!':`${c.name} wins!`); if(w==='me') confetti(); }
    else if(b.every(Boolean)){ over = 'tie'; say("It's a tie!"); }
    else turn = w==='me' ? 'them' : 'me';
    render();
    if(!over && turn==='them') later(()=>move(aiMove(), 'them'), 900);
  };
  const render = () => {
    setTurn(over ? null : turn);
    el.innerHTML = `<div class="ttt">${b.map((v,i)=>`<button class="cell" data-i="${i}" ${v||over||turn!=='me'?'disabled':''} aria-label="Square">${v?MARK[v]:''}</button>`).join('')}</div>
      ${over?`<div class="over">${over==='me'?`<span class="bigstar">${icon('star')}</span>`:''}<button class="cbtn lg c-green b3d" id="again" aria-label="Play again">${icon('undo')}</button></div>`:''}`;
    el.querySelectorAll('.cell').forEach(x=>x.onclick=()=>move(+x.dataset.i, 'me'));
    el.querySelector('#again')?.addEventListener('click', ()=>{ b = Array(9).fill(null); turn = 'me'; over = null; render(); });
  };
  render(); say('Your turn!');
}

        <button class="mini-btn" data-rm="${i}" aria-label="Remove">${icon('trash')}</button></div>`).join('')}
      <input id="an" class="field sm" maxlength="20" placeholder="New contact name">
      <div class="swatches" id="nc">${COLOR_KEYS.map(k=>`<button class="c-${k}${k===newColor?' on':''}" data-k="${k}" aria-label="${k}"></button>`).join('')}</div>
      <button class="btn c-white b3d" id="add">${icon('plus')}Add contact</button></div>

    <div class="panel"><h3>Invite a family member</h3><p>Create a one-time code and send it to them. They type it on their own phone.</p>
      <button class="btn c-white b3d" id="inv">${icon('mail')}Create invite code</button>
      ${S.invites.slice(-4).reverse().map(i=>`<div class="prow"><span class="code-chip">${i.code}</span>
        <span class="grow muted">${i.used?`Used by ${esc(i.by||'someone')}`:'Not used yet'}</span></div>`).join('')}</div>

    <div class="panel"><h3>Settings</h3>
      ${tog('typing','Text typing','Off until she can read and write. No links, ever.')}
      ${tog('filters','Video filters','Fun face filters during calls')}
      ${tog('quietOn','Quiet hours','No calls, messages or games')}
      <div class="times"><input type="time" id="qf" value="${s.quietFrom}"> to <input type="time" id="qt" value="${s.quietTo}"></div></div>

    <div class="panel"><h3>Recent activity</h3>
      <ul class="act-list">${S.activity.length ? S.activity.map(a=>`<li><span>${esc(a.text)}</span><time>${fmt(a.t)}</time></li>`).join('') : '<li>Nothing yet</li>'}</ul></div>

    <div class="panel"><h3>Security</h3><button class="btn c-white b3d" id="cpin">${icon('key')}Change PIN</button></div>

    <div class="panel demo"><h3>Prototype tools</h3><p>Pretend a family member does something.</p>
      <select id="who" class="field sm">${S.contacts.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      <div class="wrap">
        <button class="btn c-white b3d" id="simcall">${icon('phone')}Incoming call</button>
        <button class="btn c-white b3d" id="simmsg">${icon('message')}New message</button>
        <button class="btn c-white b3d" id="siminv">${icon('dice')}Game invite</button>
        <button class="btn c-red b3d" id="reset">${icon('trash')}Reset</button>
      </div></div>
  </section>`;

  $('#done').onclick = ()=>go(home);
  $$('[data-k]').forEach(x=>{ if(x.type==='checkbox') x.onchange=()=>{ s[x.dataset.k] = x.checked; save(); }; });
  $('#qf').onchange = e=>{ s.quietFrom = e.target.value; save(); };
  $('#qt').onchange = e=>{ s.quietTo = e.target.value; save(); };
  $$('#nc button').forEach(b=>b.onclick=()=>{ $$('#nc button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); newColor = b.dataset.k; });
  const swap = (i,j) => { [S.contacts[i], S.contacts[j]] = [S.contacts[j], S.contacts[i]]; save(); go(parent); };
  $$('[data-up]').forEach(b=>b.onclick=()=>swap(+b.dataset.up, +b.dataset.up-1));
  $$('[data-dn]').forEach(b=>b.onclick=()=>swap(+b.dataset.dn, +b.dataset.dn+1));
  $$('[data-rm]').forEach(b=>b.onclick=()=>{ const c = S.contacts[+b.dataset.rm];
    if(confirm(`Remove ${c.name}? They will no longer be able to reach her.`)){ S.contacts.splice(+b.dataset.rm, 1); log(`Removed ${c.name}`); go(parent); } });
  $('#add').onclick = ()=>{ const n = $('#an').value.trim(); if(!n) return toast('Type a name');
    S.contacts.push({id:'c'+Date.now(), name:n, color:newColor}); log(`Added ${n}`); go(parent); };
  $('#inv').onclick = ()=>{
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', code = Array.from(crypto.getRandomValues(new Uint8Array(6)), x=>A[x%A.length]).join('');
    S.invites.push({code, t:Date.now(), used:false}); log('Invite code created'); go(parent);
  };
  $('#cpin').onclick = ()=>go(changePin, 1, null);
  $('#simcall').onclick = ()=>{ if(isQuiet()) return toast('Blocked: quiet hours are on'); go(incoming, $('#who').value); };
  $('#simmsg').onclick = ()=>{ const id = $('#who').value; (S.messages[id] = S.messages[id]||[]).push({from:'them', type:'sticker', data:pick(STICKER_KEYS), t:Date.now()});
    S.unread[id] = true; save(); toast('Message sent — tap Done to see the dot'); };
  $('#siminv').onclick = ()=>{ if(isQuiet()) return toast('Blocked: quiet hours are on'); go(invite, $('#who').value, pick(Object.keys(GAMES)), 'in', false); };
  $('#reset').onclick = ()=>{ if(confirm('Erase everything in this prototype?')){ try{ localStorage.removeItem(STORE); }catch(e){} S = structuredClone(DEFAULT); go(welcome); } };
}

function changePin(step, first){
  app.innerHTML = `<section class="screen login center">
    <span class="lockbig c-yellow" style="background:var(--c)">${icon('key')}</span>
    <h2>${step===1?'New PIN':'Type it again'}</h2><div id="pp"></div>
    <button class="cbtn c-white b3d" id="x" aria-label="Cancel" style="margin:0 auto">${icon('x')}</button></section>`;
  $('#x').onclick = ()=>go(parent);
  pinPad($('#pp'), async (v, reset)=>{
    if(step===1) return go(changePin, 2, v);
    if(v!==first){ reset(); return toast("PINs don't match"); }
    S.pinHash = await hashPin(v); log('PIN changed'); toast('PIN changed'); go(parent);
  });
}

/* ---------- boot ---------- */
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
go(!S.setup ? welcome : S.role==='family' ? familyView : home);
</script>
</body>
</html>
